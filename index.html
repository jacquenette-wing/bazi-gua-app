<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四柱易經排盤系統</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 650px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #2c3e50; }
        
        /* 利用 direction: rtl 實現完美嘅由右至左排版，同時唔影響滑鼠點擊判定 */
        .pillars-input-container {
            display: flex;
            direction: rtl;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
            background: #fafafa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e1e8ed;
        }
        .pillar-box { flex: 1; text-align: center; direction: ltr; } /* 內文保持正常由左至右閱讀 */
        .pillar-box label { display: block; font-weight: bold; margin-bottom: 8px; color: #555; font-size: 14px; }
        .pillar-box select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; background: #fff; margin-bottom: 6px; }

        .calc-btn { width: 100%; background: #3498db; color: white; border: none; padding: 14px; font-size: 18px; border-radius: 6px; cursor: pointer; margin-top: 5px; font-weight: bold; }
        .calc-btn:hover { background: #2980b9; }

        .result { margin-top: 25px; padding: 20px; background: #eef9ff; border-left: 5px solid #3498db; border-radius: 4px; display: none; }
        .result h3 { margin-top: 0; color: #2980b9; border-bottom: 1px solid #cbd5e1; padding-bottom: 8px; }
        .result p { line-height: 1.8; margin: 8px 0; }
        .gua-title { font-size: 20px; font-weight: bold; color: #c0392b; margin-bottom: 10px; }
        .section-title { font-weight: bold; color: #2c3e50; margin-top: 15px; display: block; border-bottom: 1px dashed #b0c4de; padding-bottom: 4px; }
        .moving-highlight { background: #fff3cd; padding: 2px 6px; border-radius: 4px; border: 1px solid #ffeeba; }

        /* 排盤結果展示：由右至左 (年柱在最右，時柱在最左) */
        .bazi-display {
            display: flex;
            direction: rtl;
            justify-content: center;
            gap: 25px;
            background: #fff;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            margin: 15px 0;
            text-align: center;
        }
        .bazi-col { font-size: 18px; font-weight: bold; direction: ltr; }
        .bazi-col span { display: block; padding: 4px 0; }
        .bazi-col .label { font-size: 12px; color: #7f8c8d; margin-bottom: 4px; border-bottom: 1px solid #eee; }

        .color-wood { color: #27ae60 !important; }
        .color-fire { color: #c0392b !important; }
        .color-earth { color: #d35400 !important; }
        .color-metal { color: #7f8c8d !important; }
        .color-water { color: #2980b9 !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>四柱易經排盤系統</h2>
    
    <!-- 輸入區順序：年、月、日、時 (經 rtl 轉換後視覺上會變成由右至左：年、月、日、時) -->
    <div class="pillars-input-container">
        <!-- 年柱 -->
        <div class="pillar-box">
            <label>年柱</label>
            <select id="yearStem">
                <option value="1">甲</option><option value="2">乙</option><option value="3">丙</option><option value="4" selected>丁</option><option value="5">戊</option><option value="6">己</option><option value="7">庚</option><option value="8">辛</option><option value="9">壬</option><option value="10">癸</option>
            </select>
            <select id="yearBranch">
                <option value="1">子</option><option value="2">丑</option><option value="3">寅</option><option value="4">卯</option><option value="5">辰</option><option value="6">巳</option><option value="7">午</option><option value="8">未</option><option value="9">申</option><option value="10">酉</option><option value="11" selected>戌</option><option value="12">亥</option>
            </select>
        </div>
        <!-- 月柱 -->
        <div class="pillar-box">
            <label>月柱</label>
            <select id="monthStem">
                <option value="1">甲</option><option value="2">乙</option><option value="3">丙</option><option value="4">丁</option><option value="5">戊</option><option value="6" selected>己</option><option value="7">庚</option><option value="8">辛</option><option value="9">壬</option><option value="10">癸</option>
            </select>
            <select id="monthBranch">
                <option value="1">子</option><option value="2">丑</option><option value="3">寅</option><option value="4">卯</option><option value="5">辰</option><option value="6">巳</option><option value="7">午</option><option value="8" selected>未</option><option value="9">申</option><option value="10">酉</option><option value="11">戌</option><option value="12">亥</option>
            </select>
        </div>
        <!-- 日柱 -->
        <div class="pillar-box">
            <label>日柱</label>
            <select id="dayStem">
                <option value="1">甲</option><option value="2">乙</option><option value="3">丙</option><option value="4">丁</option><option value="5" selected>戊</option><option value="6">己</option><option value="7">庚</option><option value="8">辛</option><option value="9">壬</option><option value="10">癸</option>
            </select>
            <select id="dayBranch">
                <option value="1">子</option><option value="2">丑</option><option value="3">寅</option><option value="4">卯</option><option value="5" selected>辰</option><option value="6">巳</option><option value="7">午</option><option value="8">未</option><option value="9">申</option><option value="10">酉</option><option value="11">戌</option><option value="12">亥</option>
            </select>
        </div>
        <!-- 時柱 -->
        <div class="pillar-box">
            <label>時柱</label>
            <select id="hourStem">
                <option value="1">甲</option><option value="2">乙</option><option value="3">丙</option><option value="4">丁</option><option value="5">戊</option><option value="6">己</option><option value="7">庚</option><option value="8">辛</option><option value="9">壬</option><option value="10" selected>癸</option>
            </select>
            <select id="hourBranch">
                <option value="1">子</option><option value="2">丑</option><option value="3">寅</option><option value="4">卯</option><option value="5">辰</option><option value="6">巳</option><option value="7">午</option><option value="8">未</option><option value="9">申</option><option value="10">酉</option><option value="11">戌</option><option value="12" selected>亥</option>
            </select>
        </div>
    </div>

    <button type="button" id="calcBtn" class="calc-btn">立即起卦</button>

    <div class="result" id="resultArea">
        <h3>排盤結果</h3>
        
        <!-- 結果顯示區：由右至左 (年柱在最右，時柱在最左) -->
        <div class="bazi-display">
            <div class="bazi-col">
                <div class="label">年柱</div>
                <span id="dispYearS"></span>
                <span id="dispYearB"></span>
            </div>
            <div class="bazi-col">
                <div class="label">月柱</div>
                <span id="dispMonthS"></span>
                <span id="dispMonthB"></span>
            </div>
            <div class="bazi-col">
                <div class="label">日柱</div>
                <span id="dispDayS"></span>
                <span id="dispDayB"></span>
            </div>
            <div class="bazi-col">
                <div class="label">時柱</div>
                <span id="dispHourS"></span>
                <span id="dispHourB"></span>
            </div>
        </div>
        
        <div class="gua-title" id="resGuaTitle"></div>
        
        <span class="section-title">卦辭</span>
        <p id="resGuaCi"></p>
        
        <span class="section-title">爻辭（<span style="color:#d9534f;">黃色標示</span>為當前動爻）</span>
        <div id="resLinesList" style="margin-top: 8px;"></div>
    </div>
</div>

<script>

    3: { text: "丙", cls: "color-fire" }, 4: { text: "丁", cls: "color-fire" },
    5: { text: "戊", cls: "color-earth" }, 6: { text: "己", cls: "color-earth" },
    7: { text: "庚", cls: "color-metal" }, 8: { text: "辛", cls: "color-metal" },

    3: { text: "寅", cls: "color-wood" }, 4: { text: "卯", cls: "color-wood" },
    5: { text: "辰", cls: "color-earth" }, 6: { text: "巳", cls: "color-fire" },
    7: { text: "午", cls: "color-fire" }, 8: { text: "未", cls: "color-earth" },
    9: { text: "申", cls: "color-metal" }, 10: { text: "酉", cls: "color-metal" },
    11: { text: "戌", cls: "color-earth" }, 12: { text: "亥", cls: "color-water" }

const hexagramsData = {

    "6_4": { title: "第三卦｜水雷屯 ䷂", guaCi: "屯：元，亨，利，貞。勿用，有攸往，利建侯。", lines: { 1: "初九：磐桓，利居貞，利建侯。", 2: "六二：屯如邅如，乘馬班如。匪寇婚媾，女子貞不字，十年乃字。", 3: "六三：即鹿無虞，惟入于林中，君子幾不如舍，往吝。", 4: "六四：乘馬班如，求婚媾往，吉，無不利。", 5: "九五：屯其膏，小貞吉，大貞凶。", 6: "上六：乘馬班如，泣血漣如。" } },
    "7_6": { title: "第四卦｜山水蒙 ䷃", guaCi: "蒙：亨。匪我求童蒙，童蒙求我。初噬告，再三渎，渎則不告。利貞。", lines: { 1: "初六：发蒙，利用刑人，用说桎梏，以往吝。", 2: "九二：包蒙，吉。納婦，吉。子克家。", 3: "六三：勿用取女，見金夫，不有躬，無攸利。", 4: "六四：困蒙，吝。", 5: "六五：童蒙，吉。", 6: "上九：擊蒙，不利為寇，利御寇。" } },
    "6_1": { title: "第五卦｜水天需 ䷄", guaCi: "需：有孚，光亨，貞吉。利涉大川。", lines: { 1: "初九：需于郊，利用恆，無咎。", 2: "九二：需于沙，小有言，終吉。", 3: "九三：需于泥，致寇至。", 4: "六四：需于血，出自穴。", 5: "九五：需于酒食，貞吉。", 6: "上六：入于穴，有不速之客三人來，敬之終吉。" } },
    "1_6": { title: "第六卦｜天水訟 ䷅", guaCi: "訟：有孚，窒惕，中吉，終凶。利見大人，不利涉大川。", lines: { 1: "初六：不永所事，小有言，終吉。", 2: "九二：不克訟，歸而逋其邑人三百戶，無眚。", 3: "六三：食舊德，貞厲，終吉。或從王事，無成。", 4: "九四：不克訟，復即命，渝安貞，吉。", 5: "九五：訟，元吉。", 6: "上九：或錫之鞶帶，終朝三褫之。" } },
    "8_6": { title: "第七卦｜地水師 ䷆", guaCi: "師：貞，丈人吉，無咎。", lines: { 1: "初六：師出以律，否臧凶。", 2: "九二：在師中，吉，無咎，王三錫命。", 3: "六三：師或輿尸，凶。", 4: "六四：師左次，無咎。", 5: "六五：田有禽，利執言，無咎。長子帥師，弟子輿尸，貞凶。", 6: "上六：大君有命，開國承家，小人勿用。" } },
    "6_8": { title: "第八卦｜水地比 ䷇", guaCi: "比：吉。原筮，元永貞，無咎。不寧方來，後夫凶。", lines: { 1: "初六：有孚比之，無咎。有孚盈缶，终來有它，吉。", 2: "六二：比之自內，貞吉。", 3: "六三：比之匪人。", 4: "六四：外比之，貞吉。", 5: "九五：顯比，王用三驅，失前禽，邑人不誡，吉。", 6: "上六：比之無首，凶。" } },

    "1_2": { title: "第十卦｜天澤履 ䷉", guaCi: "履：履虎尾，不咥人，亨。", lines: { 1: "初九：素履，往無咎。", 2: "九二：履道坦坦，幽人貞吉。", 3: "六三：眇能視，跛能履，履虎尾，咥人，凶。武人為于大君。", 4: "九四：履虎尾，愬愬，終吉。", 5: "九五：夬履，貞厲。", 6: "上九：視履考祥，其旋元吉。" } },
    "8_1": { title: "第十一卦｜地天泰 ䷊", guaCi: "泰：小往大來，吉亨。", lines: { 1: "初九：拔茅茹，以其彙，征吉。", 2: "九二：包荒，用馮河，不遐遺，朋亡，得尚于中行。", 3: "九三：無平不陂，無往不復，艱貞無咎。勿恤其孚，于食有福。", 4: "六四：翩翩不富，以其鄰，不戒以孚。", 5: "六五：帝乙歸妹，以祉元吉。", 6: "上六：城復于隍，勿用師，自邑告命，貞吝。" } },

    "1_3": { title: "第十三卦｜天火同人 ䷌", guaCi: "同人：同人于野，亨。利涉大川，利君子貞。", lines: { 1: "初九：同人于門，無咎。", 2: "六二：同人于宗，吝。", 3: "九三：伏戎于莽，升其高陵，三歲不興。", 4: "九四：乘其墉，弗克攻，吉。", 5: "九五：同人，先號咷而後笑。大師克，相遇。", 6: "上九：同人于郊，無悔。" } },

    "7_8": { title: "第十五卦｜地山謙 ䷎", guaCi: "謙：亨，君子有終。", lines: { 1: "初六：謙謙君子，用涉大川，吉。", 2: "六二：鳴謙，貞吉。", 3: "九三：勞謙君子，有終，吉。", 4: "六四：無不利，撝謙。", 5: "六五：不富，以其鄰，利用侵伐，無不利。", 6: "上六：鳴謙，利用行師，征邑國。" } },
    "4_8": { title: "第十六卦｜雷地豫 ䷏", guaCi: "豫：利建侯行師。", lines: { 1: "初六：鳴豫，凶。", 2: "六二：介于石，不終日，貞吉。", 3: "六三：盱豫，悔。遅有悔。", 4: "九四：由豫，大有得。勿疑，朋簣簪。", 5: "六五：貞疾，恆不死。", 6: "上六：冥豫，成有渝，无咎。" } },
    "2_4": { title: "第十七卦｜澤雷隨 ䷐", guaCi: "隨：元亨，利貞，無咎。", lines: { 1: "初九：官有渝，貞吉. 出門交有功。", 2: "六二：系小子，失丈夫。", 3: "六三：系丈夫，失小子。隨有求得，利居貞。", 4: "九四：隨有獲，貞凶。有孚在道，以明，何咎。", 5: "九五：孚于嘉，吉。", 6: "上六：拘系之，乃從維之。王用亨于西山。" } },
    "7_5": { title: "第十八卦｜山風蠱 ䷑", guaCi: "蠱：元亨，利涉大川。先甲三日，後甲三日。", lines: { 1: "初六：幹父之蠱，有子，考無咎，厲終吉。", 2: "九二：幹母之蠱，不可貞。", 3: "九三：幹父之蠱，小有悔，無大咎。", 4: "六四：裕父之蠱，往見吝。", 5: "六五：幹父之蠱，用譽。", 6: "上九：不事王侯，高尚其事。" } },
    "8_2": { title: "第十九卦｜地澤臨 ䷒", guaCi: "臨：元亨利貞，至于八月有凶。", lines: { 1: "初九：咸臨，貞吉。", 2: "九二：咸臨，吉，無不利。", 3: "六三：甘臨，無攸利，既憂之，無咎。", 4: "六四：至臨，無咎。", 5: "六五：知臨，大君之宜，吉。", 6: "上六：敦臨，吉，無咎。" } },
    "5_8": { title: "第二十卦｜風地觀 ䷓", guaCi: "觀：盥而不薦，有孚顒若。", lines: { 1: "初六：童觀，小人無咎，君子吝。", 2: "六二：闚觀，利女貞。", 3: "六三：觀我生，進退。", 4: "六四：觀國之光，利用賓于王。", 5: "九五：觀我生，君子無咎。", 6: "上九：觀其生，君子無咎。" } },
    "3_4": { title: "第二十一卦｜火雷噬嗑 ䷔", guaCi: "噬嗑：亨。利用獄。", lines: { 1: "初九：屨校灭趾，無咎。", 2: "六二：噬膚灭鼻，無咎。", 3: "六三：噬腊肉，遇毒，小吝，无咎。", 4: "九四：噬干胏，得金矢，利艱貞，吉。", 5: "六五：噬干肉，得黃金，貞厲，無咎。", 6: "上九：何校滅耳，凶。" } },
    "7_3": { title: "第二十二卦｜山火賁 ䷕", guaCi: "賁：亨。小利有所往。", lines: { 1: "初九：賁其趾，舍車而徒。", 2: "六二：賁其須。", 3: "九三：賁如濡如，永貞吉。", 4: "六四：賁如皤如，白馬翰如，匪寇婚媾。", 5: "六五：賁于丘園，束帛戔戔，吝，終吉。", 6: "上九：白賁，無咎。" } },
    "7_8": { title: "第二十三卦｜山地剝 ䷖", guaCi: "剝：不利有攸往。", lines: { 1: "初六：剝床以足，蔑貞，凶。", 2: "六二：剝床以辨，蔑貞，凶。", 3: "六三：剝之，無咎。", 4: "六四：剝床以膚，凶。", 5: "六五：貫魚，以宮人寵，無不利。", 6: "上九：碩果不食，君子得輿，小人剝廬。" } },
    "4_1": { title: "第二十四卦｜地雷復 ䷗", guaCi: "復：亨。出入無疾，朋來無咎。反復其道，七日來復，利有攸往。", lines: { 1: "初九：不遠復，無祇悔，元吉。", 2: "六二：休復，吉。", 3: "六三：頻復，厲，無咎。", 4: "六四：中行獨復。", 5: "六五：敦復，無悔。", 6: "上六：迷復，凶，有災眚。用行師，終有大敗，以其國君，凶，至于十年不克征。" } },
    "1_4": { title: "第二十五卦｜天雷無妄 ䷘", guaCi: "無妄：元，亨，利，貞。其匪正有眚，不利有攸往。", lines: { 1: "初九：無妄，往吉。", 2: "六二：不耕穫，不菑畬，則利有攸往。", 3: "六三：無妄之災，或系之牛，行人之得，邑人之災。", 4: "九四：可貞，無咎。", 5: "九五：無妄之疾，勿藥有喜。", 6: "上九：無妄之行，眚有攸往，無攸利。" } },
    "7_1": { title: "第二十六卦｜山天大畜 ䷙", guaCi: "大畜：利貞，不家食吉，利涉大川。", lines: { 1: "初九：有厉，利已。", 2: "九二：輿說輹。", 3: "九三：良馬逐，利艱貞。曰閑輿衛，利有攸往。", 4: "六四：童牛之牿，元吉。", 5: "六五：豶豕之牙，吉。", 6: "上九：何天之衢，亨。" } },
    "7_4": { title: "第二十七卦｜山雷頤 ䷚", guaCi: "頤：貞吉。觀頤，自求口實。", lines: { 1: "初九：舍爾靈龜，觀我朵頤，凶。", 2: "六二：顛頤，拂經，于丘頤，征凶。", 3: "六三：拂頤，貞凶，十年勿用，無攸利。", 4: "六四：顛頤，吉。虎視眈眈，其欲逐逐，無咎。", 5: "六五：拂經，居貞吉，不可涉大川。", 6: "上九：由頤，厲吉，利涉大川。" } },
    "2_5": { title: "第二十八卦｜澤風大過 ䷛", guaCi: "大過：棟桡，利有攸往，亨。", lines: { 1: "初六：藉用白茅，無咎。", 2: "九二：枯楊生稊，老夫得其女妻，無不利。", 3: "六三：棟桡，凶。", 4: "九四：棟隆，吉。有它吝。", 5: "九五：枯楊生華，老婦得其士夫，无咎無誉。", 6: "上六：過涉滅頂，凶，無咎。" } },
    "6_6": { title: "第二十九卦｜坎為水 ䷜", guaCi: "習坎：有孚，維心亨，行有尚。", lines: { 1: "初六：習坎，入于坎窞，凶。", 2: "九二：坎有險，求小得。", 3: "六三：來之坎坎，險且枕，入于坎窞，勿用。", 4: "六四：樽酒簋貳，用缶，納約自牖，終無咎。", 5: "九五：坎不盈，坻既平，無咎。", 6: "上六：系用徽纆，寘于叢棘，三歲不得，凶。" } },
    "3_3": { title: "第三十卦｜離為火 ䷝", guaCi: "離：利貞，亨。畜牝牛，吉。", lines: { 1: "初九：履錯然，敬之，無咎。", 2: "六二：黃離，元吉。", 3: "九三：日昃之離，不鼓缶而歌，則大耋之嗟，凶。", 4: "九四：突如其來如，焚如，死如，棄如。", 5: "六五：出涕沱若，戚嗟若，吉。", 6: "上九：王用出征，有嘉折首，匪其丑，無咎。" } },
    "7_2": { title: "第三十一卦｜澤山咸 ䷞", guaCi: "咸：亨，利貞，取女吉。", lines: { 1: "初六：咸其拇。", 2: "六二：咸其腓，凶，居吉。", 3: "九三：咸其股，持其隨，往吝。", 4: "九四：貞吉，悔亡。憧憧往來，朋從爾思。", 5: "九五：咸其脢，無悔。", 6: "上六：咸其輔、頰、舌。" } },
    "4_5": { title: "第三十二卦｜雷風恒 ䷟", guaCi: "恒：亨，無咎，利貞，利有攸往。", lines: { 1: "初六：浚恒，貞凶，無攸利。", 2: "九二：悔亡。", 3: "九三：不恒其德，或羞之，貞吝。", 4: "九四：田無禽。", 5: "六五：恒其德，貞，婦人吉，夫子凶。", 6: "上六：振恒，凶。" } },
    "1_7": { title: "第三十三卦｜天山遯 ䷠", guaCi: "遯：亨，小利貞。", lines: { 1: "初六：遯尾，厲，勿用有攸往。", 2: "六二：執之用黄牛之革，莫之勝說。", 3: "九三：系遯，有疾厲。畜臣妾，吉。", 4: "九四：好遯，君子吉，小人否。", 5: "九五：嘉遯，貞吉。", 6: "上九：肥遯，無不利。" } },
    "4_1": { title: "第三十四卦｜雷天大壯 ䷡", guaCi: "大壯：利貞。", lines: { 1: "初九：壯于趾，征凶，有孚。", 2: "九二：貞吉。", 3: "九三：小人用壯，君子用罔，厲。羝羊触藩，羸其角。", 4: "九四：貞吉，悔亡。藩決不羸，壯于大輿之輹。", 5: "六五：喪羊于易，無悔。", 6: "上九：羝羊触藩，不能退，不能遂，無攸利，艱則吉。" } },
    "3_8": { title: "第三十五卦｜火地晉 ䷢", guaCi: "晉：康侯用賜馬蕃庶，晝日三接。", lines: { 1: "初六：晉如，摧如，貞吉。孚允裕，無咎。", 2: "六二：晉如，愁如，貞吉。得受茲介福于其王母。", 3: "六三：眾允，悔亡。", 4: "九四：晉如鼯鼠，貞厲。", 5: "六五：悔亡，失得勿恤，往吉，無不利。", 6: "上九：晉其角，維用伐邑，厲吉，無咎，貞吝。" } },
    "8_3": { title: "第三十六卦｜地火明夷 ䷣", guaCi: "明夷：利艱貞。", lines: { 1: "初九：明夷于飛，垂其翼。君子于行，三日不食，有攸往，主人有言。", 2: "六二：明夷，夷于左股，用拯馬壯，吉。", 3: "九三：明夷于南狩，得其大首，不可疾貞。", 4: "六四：入于左腹，獲明夷之心，于出門庭。", 5: "六五：箕子之明夷，利貞。", 6: "上六：不明晦，初登于天，後入于地。" } },
    "5_3": { title: "第三十七卦｜風火家人 ䷤", guaCi: "家人：利女貞。", lines: { 1: "初九：閑有家，悔亡。", 2: "六二：无攸遂，在中馈，貞吉。", 3: "九三：家人嗍嗍，悔厲，吉；婦子嘻嘻，終吝。", 4: "六四：富家，大吉。", 5: "九五：王仮有家，勿恤，吉。", 6: "上九：有孚，威如，終吉。" } },
    "3_2": { title: "第三十八卦｜火澤睽 ䷥", guaCi: "睽：小事吉。", lines: { 1: "初九：悔亡，喪馬勿逐，自復。見惡人，無咎。", 2: "九二：遇主于巷，無咎。", 3: "六三：見輿曳，其牛掣，其人天且劓，無初有終。", 4: "九四：睽孤，遇元夫，交孚，厲無咎。", 5: "六五：悔亡，厥宗噬膚，往何咎。", 6: "上九：睽孤，見豕負塗，載鬼一車，先張之弧，後說之弧，匪寇婚媾，往遇雨則吉。" } },
    "6_7": { title: "第三十九卦｜水山蹇 ䷦", guaCi: "蹇：利西南，不利東北；利見大人，貞吉。", lines: { 1: "初六：往蹇，來譽。", 2: "六二：王臣蹇蹇，匪躬之故。", 3: "九三：往蹇來反。", 4: "六四：往蹇來連。", 5: "九五：大蹇朋來。", 6: "上六：往蹇來碩，吉，利見大人。" } },
    "4_6": { title: "第四十卦｜雷水解 ䷧", guaCi: "解：利西南。無所往，其來復吉。有攸往，夙吉。", lines: { 1: "初六：無咎。", 2: "九二：田獲三狐，得黃矢，貞吉。", 3: "六三：負且乘，致寇至，貞吝。", 4: "九四：解而拇，朋至斯孚。", 5: "六五：君子維有解，吉，有孚于小人。", 6: "上六：公用射隼于高墉之上，穫之，無不利。" } },
    "7_2": { title: "第四十一卦｜山澤損 ䷨", guaCi: "損：有孚，元吉，無咎，可貞，利有攸往。曷之用？二簋可用享。", lines: { 1: "初九：巳事遄往，無咎，酌損之。", 2: "九二：利貞，征凶，弗損益之。", 3: "六三：三人行則損一人，一人行則得其友。", 4: "六四：損其疾，使遄有喜，無咎。", 5: "六五：或益之十朋之龜，弗克违，元吉。", 6: "上九：益之不損，弗咎，貞吉，利有攸往，得臣無家。" } },
    "5_4": { title: "第四十二卦｜風雷益 ䷩", guaCi: "益：利有攸往，利涉大川。", lines: { 1: "初九：利用為大作，元吉，無咎。", 2: "六二：或益之十朋之龜，弗克違，永貞吉。王用享于帝，吉。", 3: "六三：用凶事，得孚，中行告公用圭。", 4: "六四：中行告公從，利用為依遷國。", 5: "九五：有孚惠心，勿問元吉，有孚惠我德。", 6: "上九：勿益之，或擊之，立心勿恒，凶。" } },
    "1_2": { title: "第四十三卦｜澤天夬 ䷪", guaCi: "夬：扬于王庭，孚号，有厉，告自邑，不利即戎，利有攸往。", lines: { 1: "初九：壯于前趾，往不勝為咎。", 2: "九二：惕號，莫夜有戎，勿恤。", 3: "九三：夬夬，有行，凶。君子夬夬，獨行遇雨，若濡有愠，無咎。", 4: "九四：臀無膚，其行次且。牽羊悔亡，聞言不信。", 5: "九五：莧陸夬夬，中行無咎。", 6: "上六：無號，終有凶。" } },
    "1_5": { title: "第四十四卦｜天風姤 ䷫", guaCi: "姤：女壯，勿用取女。", lines: { 1: "初六：系于金柅，貞吉。有攸往，見凶，羸豕孚踟躕。", 2: "九二：包有魚，無咎，不利賓。", 3: "九三：臀無膚，其行次且，厲，無大咎。", 4: "九四：包無魚，起凶。", 5: "九五：以杞包瓜，含章，有隕自天。", 6: "上九：角姤，吝，無咎。" } },
    "2_8": { title: "第四十五卦｜澤地萃 ䷬", guaCi: "萃：亨。王假有廟，利見大人，亨，利貞。用大牲吉，利有攸往。", lines: { 1: "初六：有孚不終，乃乱乃萃。若号，一握为笑，勿恤，往无咎。", 2: "六二：引吉，无咎，孚乃利用禴。", 3: "六三：萃如，嗟如，无攸利，往无咎，小吝。", 4: "九四：大吉，无咎。", 5: "九五：萃有位，无咎。匪孚，元永貞，悔亡。", 6: "上六：齎咨涕洟，无咎。" } },
    "8_5": { title: "第四十六卦｜地風升 ䷭", guaCi: "升：元亨，用見大人，勿恤，南征吉。", lines: { 1: "初六：允升，大吉。", 2: "九二：孚利用禴，無咎。", 3: "九三：升虛邑。", 4: "六四：王用亨于岐山，吉，無咎。", 5: "六五：貞吉，升階。", 6: "上六：冥升，利于不息之貞。" } },
    "2_6": { title: "第四十七卦｜澤水困 ䷮", guaCi: "困：亨，貞，大人吉，無咎。言不信。", lines: { 1: "初六：臀困于株木，入于幽谷，三歲不覿。", 2: "九二：困于酒食，朱紱方來，利用享祀，征凶，無咎。", 3: "六三：困于石，據于蒺藜，入于其宮，見妻不見，凶。", 4: "九四：來徐徐，困于金車，吝，有終。", 5: "九五：劓刖，困于赤紱，乃徐有說，利用祭祀。", 6: "上六：困于葛藟，于臲卼，曰動悔有悔，征吉。" } },
    "6_5": { title: "第四十八卦｜水風井 ䷯", guaCi: "井：改邑不改井，無喪無得。往來井井，汔至，亦未繘井，羸其瓶，凶。", lines: { 1: "初六：井泥不食，舊井無禽。", 2: "九二：井谷射鮒，甕敝漏。", 3: "九三：井渫不食，為我心恻，可用汲，王明，並受其福。", 4: "六四：井甃，無咎。", 5: "九五：井冽，寒泉食。", 6: "上六：井收勿幕，有孚元吉。" } },
    "2_1": { title: "第四十九卦｜澤火革 ䷰", guaCi: "革：己日乃孚，元亨利貞，悔亡。", lines: { 1: "初九：用黃牛之革。", 2: "六二：己日乃革之，征吉，無咎。", 3: "九三：征凶，貞厲。革言三就，有孚。", 4: "九四：悔亡，有孚改命，吉。", 5: "九五：大人虎变，未占有孚。", 6: "上九：君子豹变，小人革面，征凶，居貞吉。" } },
    "3_5": { title: "第五十卦｜火風鼎 ䷱", guaCi: "鼎：元吉，亨。", lines: { 1: "初六：鼎颠趾，利出否，得妾以其子，無咎。", 2: "九二：鼎有實，我仇有疾，不我能即，吉。", 3: "九三：鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉。", 4: "九四：鼎折足，覆公餗，其形渥，凶。", 5: "六五：鼎黃耳，金鉉，利貞。", 6: "上九：鼎玉鉉，大吉，無不利。" } },
    "4_4": { title: "第五十一卦｜震為雷 ䷲", guaCi: "震：亨。震來虩虩，笑言啞啞。震驚百里，不喪匕鬯。", lines: { 1: "初九：震來虩虩，後笑言啞啞，吉。", 2: "六二：震來厲，億喪貝，躋于九陵，勿逐，七日得。", 3: "六三：震蘇蘇，震行无眚。", 4: "九四：震遂泥。", 5: "六五：震往來，厲，億無喪，有事。", 6: "上六：震索索，视矍矍，征凶。震不于其躬，于其鄰，无咎。婚媾有言。" } },
    "7_7": { title: "第五十二卦｜艮為山 ䷳", guaCi: "艮：艮其背，不獲其身，行其庭，不见其人，无咎。", lines: { 1: "初六：艮其趾，无咎，利永貞。", 2: "六二：艮其腓，不拯其隨，其心不快。", 3: "九三：艮其限，列其夤，厲薰心。", 4: "六四：艮其身，无咎。", 5: "六五：艮其輔，言有序，悔亡。", 6: "上九：敦艮，吉。" } },
    "5_7": { title: "第五十三卦｜風山漸 ䷴", guaCi: "漸：女歸吉，利貞。", lines: { 1: "初六：鴻漸于干，小子厲，有言，无咎。", 2: "六二：鴻漸于磐，飲食衎衎，吉。", 3: "九三：鴻漸于陸，夫征不復，婦孕不育，凶。利用御寇。", 4: "六四：鴻漸于木，或得其桷，无咎。", 5: "九五：鴻漸于陵，婦三歲不孕，終莫之勝，吉。", 6: "上九：鴻漸于陸，其羽可用為儀，吉。" } },
    "4_2": { title: "第五十四卦｜雷澤歸妹 ䷵", guaCi: "歸妹：征凶，無攸利。", lines: { 1: "初九：歸妹以娣，跛能履，征吉。", 2: "九二：眇能視，利幽人之貞。", 3: "六三：歸妹以須，反歸以娣。", 4: "九四：歸妹愆期，遲歸有時。", 5: "六五：帝乙歸妹，其君之袂，不如其娣之袂良。月幾望，吉。", 6: "上六：女承筐無實，士刲羊無血，無攸利。" } },
    "4_3": { title: "第五十五卦｜雷火豐 ䷶", guaCi: "豐：亨，王仮之。勿忌，宜日中。", lines: { 1: "初九：見其配主，雖旬無咎，往有尚。", 2: "六二：豐其蔀，日中見斗，往得疑疾，有孚发若，吉。", 3: "九三：豐其沛，日中見沫，折其右肱，無咎。", 4: "九四：豐其蔀，日中見斗，遇其夷主，吉。", 5: "六五：来章，有庆譽，吉。", 6: "上六：豐其屋，蔀其家，闃其无人，三岁不覿，凶。" } },
    "7_3": { title: "第五十六卦｜火山旅 ䷷", guaCi: "旅：小亨，旅貞吉。", lines: { 1: "初六：旅瑣瑣，斯其所取災。", 2: "六二：旅即次，怀其资，得童僕，貞。", 3: "九三：旅焚其次，喪其童僕，貞厉。", 4: "九四：旅于处，得其资财，我心不快。", 5: "六五：射雉，一矢亡，終以誉命。", 6: "上九：鳥焚其巢，旅人先笑後号咷。丧牛于易，凶。" } },
    "5_5": { title: "第五十七卦｜巽為風 ䷸", guaCi: "巽：小亨，利有攸往，利見大人。", lines: { 1: "初六：進退，利武人之貞。", 2: "九二：巽在牀下，用史巫紛若，吉，無咎。", 3: "九三：頻巽，吝。", 4: "六四：悔亡，田獲三品。", 5: "九五：貞吉，悔亡，無不利。無初有終，先甲三日，後甲三日，吉。", 6: "上六：巽在牀下，喪其資斧，貞凶。" } },
    "2_2": { title: "第五十八卦｜兌為澤 ䷹", guaCi: "兌：亨，利貞。", lines: { 1: "初九：和兌，吉。", 2: "九二：孚兌，吉，悔亡。", 3: "六三：來兌，凶。", 4: "九四：商兌未寧，介疾有喜。", 5: "九五：孚于剝，有厲。", 6: "上六：引兌。" } },
    "6_5": { title: "第五十九卦｜水風渙 ䷺", guaCi: "渙：亨。王仮有廟，利涉大川，利貞。", lines: { 1: "初六：用拯馬壯，吉。", 2: "九二：渙奔其机，悔亡。", 3: "六三：渙其躬，无悔。", 4: "六四：渙其群，元吉。渙有丘，匪夷所思。", 5: "九五：渙汗其大號，渙王居，无咎。", 6: "上九：渙其血，去逖出，无咎。" } },
    "2_6": { title: "第六十卦｜水澤節 ䷻", guaCi: "節：亨。苦節不可貞。", lines: { 1: "初九：不出戶庭，無咎。", 2: "九二：不出門庭，凶。", 3: "六三：不節若，則嗟若，無咎。", 4: "六四：安節，亨。", 5: "九五：甘節，吉，往有尚。", 6: "上六：苦節，貞凶，悔亡。" } },
    "5_2": { title: "第六十一卦｜風澤中孚 ䷼", guaCi: "中孚：豚魚吉，利涉大川，利貞。", lines: { 1: "初九：虞吉，有它不燕。", 2: "九二：鳴鶴在陰，其子和之。我有好爵，吾與爾靡之。", 3: "六三：得敵，或鼓或罷，或泣或歌。", 4: "六四：月幾望，馬匹亡，無咎。", 5: "九五：有孚攣如，無咎。", 6: "上九：翰音登于天，貞凶。" } },
    "4_7": { title: "第六十二卦｜雷山小過 ䷽", guaCi: "小過：亨，利貞。可小事，不可大事。飛鳥遺之音，不宜上，宜下，大吉。", lines: { 1: "初六：飛鳥以凶。", 2: "六二：過其祖，遇其妣。不及其君，遇其臣，無咎。", 3: "九三：弗過防之，從或戕之，凶。", 4: "九四：無咎，弗過遇之。往厲必戒，勿用永貞。", 5: "六五：密雲不雨，自我西郊，公弋取彼在穴。", 6: "上六：弗遇過之，飛鳥離之，凶，是謂災眚。" } },
    "6_3": { title: "第六十三卦｜水火既濟 ䷾", guaCi: "既濟：亨，小利貞，初吉終亂。", lines: { 1: "初九：曳其輪，濡其尾，無咎。", 2: "六二：婦喪其茀，勿逐，七日得。", 3: "九三：高宗伐鬼方，三年克之，小人勿用。", 4: "六四：繻有衣袽，終日戒。", 5: "九五：東鄰殺牛，不如西鄰之禴祭，實受其福。", 6: "上六：濡其首，厉。" } },
    "3_6": { title: "第六十四卦｜火水未濟 ䷿", guaCi: "未濟：亨。小狐汔濟，濡其尾，無攸利。", lines: { 1: "初九：濡其尾，吝。", 2: "九二：曳其輪，貞吉。", 3: "六三：未濟，征凶，利涉大川。", 4: "九四：貞吉，悔亡，震用伐鬼方，三年有賞于大國。", 5: "六五：貞吉，無悔，君子之光，有孚，吉。", 6: "上六: 有孚于飲酒，無咎，失其首，載。" } }
};

function getRemainder(sum, divisor) {
    let rem = sum % divisor;
    return rem === 0 ? divisor : rem;
}

document.getElementById('calcBtn').onclick = function() {
    let yS = parseInt(document.getElementById('yearStem').value);
    let yB = parseInt(document.getElementById('yearBranch').value);
    let mS = parseInt(document.getElementById('monthStem').value);
    let mB = parseInt(document.getElementById('monthBranch').value);
    let dS = parseInt(document.getElementById('dayStem').value);
    let dB = parseInt(document.getElementById('dayBranch').value);
    let hS = parseInt(document.getElementById('hourStem').value);
    let hB = parseInt(document.getElementById('hourBranch').value);

    let upperSum = yS + yB + mS + mB;
    let upperGuaNum = getRemainder(upperSum, 8);

    let lowerSum = dS + dB + hS + hB;
    let lowerGuaNum = getRemainder(lowerSum, 8);

    let totalSum = upperSum + lowerSum;
    let movingLine = getRemainder(totalSum, 6);

    let key = `${upperGuaNum}_${lowerGuaNum}`;
    let hexInfo = hexagramsData[key];

    let resultArea = document.getElementById('resultArea');
    resultArea.style.display = 'block';

    function renderPillar(stemVal, branchVal, sId, bId) {
        let sObj = stemData[stemVal];
        let bObj = branchData[branchVal];
        let sEl = document.getElementById(sId);
        let bEl = document.getElementById(bId);
        sEl.innerText = sObj.text;
        sEl.className = sObj.cls;
        bEl.innerText = bObj.text;
        bEl.className = bObj.cls;
    }

    renderPillar(yS, yB, 'dispYearS', 'dispYearB');
    renderPillar(mS, mB, 'dispMonthS', 'dispMonthB');
    renderPillar(dS, dB, 'dispDayS', 'dispDayB');
    renderPillar(hS, hB, 'dispHourS', 'dispHourB');

    if (hexInfo) {
        document.getElementById('resGuaTitle').innerText = hexInfo.title;
        document.getElementById('resGuaCi').innerText = hexInfo.guaCi;

        let linesHtml = "";
        for (let i = 1; i <= 6; i++) {
            let lineText = hexInfo.lines[i] || `第 ${i} 爻：(待補錄)`;
            if (i === movingLine) {
                linesHtml += `<p class="moving-highlight"><b>${lineText} ⬅ [此乃動爻轉折點]</b></p>`;
            } else {
                linesHtml += `<p>${lineText}</p>`;
            }
        }
        document.getElementById('resLinesList').innerHTML = linesHtml;
    } else {
        document.getElementById('resGuaTitle').innerText = `上${upperGuaNum}下${lowerGuaNum}`;
        document.getElementById('resGuaCi').innerText = "此組合暫未對應到標準六十四卦資料庫。";
        let linesHtml = "";
        for (let i = 1; i <= 6; i++) {
            if (i === movingLine) {
                linesHtml += `<p class="moving-highlight"><b>第 ${i} 爻動 ⬅ [此乃動爻轉折點]</b></p>`;
            } else {
                linesHtml += `<p>第 ${i} 爻</p>`;
            }
        }
        document.getElementById('resLinesList').innerHTML = linesHtml;
    }
};
</script>
